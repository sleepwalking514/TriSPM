[kernel]
name = "batched_gemm"
env_prefix = "BATCHED_GEMM_"
tag_template = "b{BATCH}_{M}x{N}x{K}/{BLOCK_SIZE_M}x{BLOCK_SIZE_N}x{BLOCK_SIZE_K}"
expect_spm = true

[kernel.verify]
expect_dma = true

[params]
BATCH = 4
M = 256
N = 256
K = 256
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 32
BLOCK_SIZE_K = 32
GROUP_SIZE_M = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 0
TOLERANCE = "1e-3f"

[mode_params.spm]
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 32
BLOCK_SIZE_K = 32
GROUP_SIZE_M = 1

[mode_params.cache]
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 64
BLOCK_SIZE_K = 64
GROUP_SIZE_M = 1

[env]
TRITON_MICRO_M = "8"
TRITON_SPM_WINDOW_K = "4"
TRITON_SPM_PROMOTION_REPORT = "1"

[build]
c_macros = [
    "BATCH={BATCH}",
    "M={M}",
    "N={N}",
    "K={K}",
    "BLOCK_SIZE_M={BLOCK_SIZE_M}",
    "BLOCK_SIZE_N={BLOCK_SIZE_N}",
    "BLOCK_SIZE_K={BLOCK_SIZE_K}",
    "BATCHED_GEMM_WARMUP_ITERS={WARMUP_ITERS}",
    "BATCHED_GEMM_MEASURE_ITERS={MEASURE_ITERS}",
    "BATCHED_GEMM_FLUSH_BEFORE_ROI={FLUSH_BEFORE_ROI}",
    "BATCHED_GEMM_CHECK_RESULT={CHECK_RESULT}",
    "BATCHED_GEMM_TOLERANCE={TOLERANCE}",
]

[presets.smoke]
BATCH = 2
M = 64
N = 64
K = 64
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 32
BLOCK_SIZE_K = 32
GROUP_SIZE_M = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1
TOLERANCE = "1e-3f"

[presets.paper]
BATCH = 4
M = 256
N = 256
K = 256
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 32
BLOCK_SIZE_K = 32
GROUP_SIZE_M = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 0
TOLERANCE = "1e-3f"

[presets.steady]
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0
CHECK_RESULT = 0

[sweeps.blocking]
values = [
    { BLOCK_SIZE_M = 32, BLOCK_SIZE_N = 32, BLOCK_SIZE_K = 32 },
    { BLOCK_SIZE_M = 32, BLOCK_SIZE_N = 64, BLOCK_SIZE_K = 32 },
    { BLOCK_SIZE_M = 64, BLOCK_SIZE_N = 32, BLOCK_SIZE_K = 32 },
]
tag_template = "b{BATCH}_{M}x{N}x{K}/{BLOCK_SIZE_M}x{BLOCK_SIZE_N}x{BLOCK_SIZE_K}"
