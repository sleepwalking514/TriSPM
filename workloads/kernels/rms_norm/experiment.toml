[kernel]
name = "rms_norm"
env_prefix = ""
tag_template = "{M}x{N}/bn{BLOCK_N}-spmrb{SPM_ROW_BLOCK}-spmrg{SPM_ROW_GROUP_BLOCKS}"
expect_spm = true

[kernel.verify]
expect_dma = true
expect_promotion_source = "RMSNorm x row block"
expect_promotion_reason = "accepted_block_resident_fill_first"
expect_residency_plan = "RMSNorm x row block"

[params]
M = 512
N = 512
BLOCK_N = 8
CHECK_RESULT = 1
RMSNORM_FLUSH_BEFORE_ROI = 1
SPM_ROW_BLOCK = 4
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1

[build]
c_macros = [
    "M={M}",
    "N={N}",
    "BLOCK_N={BLOCK_N}",
    "RMSNORM_CHECK_RESULT={CHECK_RESULT}",
    "RMSNORM_FLUSH_BEFORE_ROI={RMSNORM_FLUSH_BEFORE_ROI}",
    "RMSNORM_SPM_ROW_BLOCK={SPM_ROW_BLOCK}",
    "RMSNORM_SPM_ROW_GROUP_BLOCKS={SPM_ROW_GROUP_BLOCKS}",
    "RMSNORM_SPM_INTERNAL_ROW_BLOCK={SPM_INTERNAL_ROW_BLOCK}",
]

[mode_params.cache]
SPM_ROW_BLOCK = 1
SPM_ROW_GROUP_BLOCKS = 1
SPM_INTERNAL_ROW_BLOCK = 0

[presets.smoke]
M = 256
N = 512
BLOCK_N = 8
CHECK_RESULT = 1
RMSNORM_FLUSH_BEFORE_ROI = 1
SPM_ROW_BLOCK = 4
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1

[presets.large]
M = 512
N = 512
BLOCK_N = 8
CHECK_RESULT = 1
RMSNORM_FLUSH_BEFORE_ROI = 1
SPM_ROW_BLOCK = 4
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1

[preset_env.smoke]
TRITON_ENABLE_SPM_ROW_RESIDENT_REDUCTIONS = "1"
TRITON_ENABLE_SPM_PROMOTION_PROFITABILITY = "1"
TRITON_SPM_ROW_RESIDENT_PRODUCER_PASS = "row_block_dma"
TRITON_SPM_RMSNORM_INTERNAL_ROW_BLOCK = "1"
TRITON_SPM_RMSNORM_ROW_BLOCK = "4"
TRITON_SPM_RMSNORM_ROW_GROUP_BLOCKS = "8"
TRITON_SPM_PROMOTION_REPORT = "1"

[preset_env.large]
TRITON_ENABLE_SPM_ROW_RESIDENT_REDUCTIONS = "1"
TRITON_ENABLE_SPM_PROMOTION_PROFITABILITY = "1"
TRITON_SPM_ROW_RESIDENT_PRODUCER_PASS = "row_block_dma"
TRITON_SPM_RMSNORM_INTERNAL_ROW_BLOCK = "1"
TRITON_SPM_RMSNORM_ROW_BLOCK = "4"
TRITON_SPM_RMSNORM_ROW_GROUP_BLOCKS = "8"
TRITON_SPM_PROMOTION_REPORT = "1"

[sweeps.blocking]
values = [
    { name = "default", BLOCK_N = 8, SPM_ROW_BLOCK = 4, SPM_ROW_GROUP_BLOCKS = 8, SPM_INTERNAL_ROW_BLOCK = 1 },
]
tag_template = "{M}x{N}/bn{BLOCK_N}-spmrb{SPM_ROW_BLOCK}-spmrg{SPM_ROW_GROUP_BLOCKS}"
