[kernel]
name = "softmax"
env_prefix = "SOFTMAX_"
tag_template = "{M}x{N}/canonical-bn{BLOCK_N}-spmrb{SPM_ROW_BLOCK}-spmrg{SPM_ROW_GROUP_BLOCKS}"
expect_spm = true

[kernel.verify]
expect_dma = true

[params]
M = 512
N = 512
BLOCK_N = 512
CAUSAL = 0
SPM_ROW_BLOCK = 2
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1
DEBUG_DUMP = 0

[build]
c_macros = [
    "M={M}",
    "N={N}",
    "BLOCK_N={BLOCK_N}",
    "SOFTMAX_CAUSAL={CAUSAL}",
    "SPM_ROW_BLOCK={SPM_ROW_BLOCK}",
    "SPM_ROW_GROUP_BLOCKS={SPM_ROW_GROUP_BLOCKS}",
    "SOFTMAX_SPM_INTERNAL_ROW_BLOCK={SPM_INTERNAL_ROW_BLOCK}",
    "SOFTMAX_WARMUP_ITERS={WARMUP_ITERS}",
    "SOFTMAX_MEASURE_ITERS={MEASURE_ITERS}",
    "SOFTMAX_FLUSH_BEFORE_ROI={FLUSH_BEFORE_ROI}",
    "SOFTMAX_CHECK_RESULT={CHECK_RESULT}",
    "SOFTMAX_DEBUG_DUMP={DEBUG_DUMP}",
]

[mode_params.spm]
BLOCK_N = 32
SPM_ROW_BLOCK = 2
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1

[mode_params.cache]
SPM_ROW_BLOCK = 1
SPM_ROW_GROUP_BLOCKS = 1
SPM_INTERNAL_ROW_BLOCK = 0

[presets.steady]
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0

[presets.smoke]
M = 256
N = 256
BLOCK_N = 256
SPM_ROW_BLOCK = 2
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[preset_env.smoke]
# Keep the smoke on the same row-block exp-cache schedule while preserving the
# explicit result check used by CI-style smoke runs.
TRITON_ENABLE_SPM_PROMOTION_PROFITABILITY = "0"

[presets.large]
M = 512
N = 512
BLOCK_N = 32
SPM_ROW_BLOCK = 2
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[presets.steady-large]
M = 512
N = 512
BLOCK_N = 32
SPM_ROW_BLOCK = 2
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0
CHECK_RESULT = 1

[presets.row-resident]
M = 512
N = 512
BLOCK_N = 32
SPM_ROW_BLOCK = 1
SPM_ROW_GROUP_BLOCKS = 1
SPM_INTERNAL_ROW_BLOCK = 0
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[preset_env.row-resident]
TRITON_ENABLE_SPM_ROW_RESIDENT_REDUCTIONS = "1"
TRITON_ENABLE_SPM_PROMOTION_PROFITABILITY = "0"
TRITON_SPM_ROW_RESIDENT_PRODUCER_PASS = "fill_on_first_pass"
TRITON_SPM_ROW_RESIDENT_MAX_BYTES = "8192"
TRITON_SPM_SOFTMAX_INTERNAL_ROW_BLOCK = "0"
TRITON_SPM_SOFTMAX_CACHE_EXP = "0"
TRITON_SPM_PROMOTION_REPORT = "1"

[presets.producer-store]
M = 512
N = 512
BLOCK_N = 32
SPM_ROW_BLOCK = 1
SPM_ROW_GROUP_BLOCKS = 1
SPM_INTERNAL_ROW_BLOCK = 0
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[preset_env.producer-store]
TRITON_ENABLE_SPM_ROW_RESIDENT_REDUCTIONS = "1"
TRITON_ENABLE_SPM_PROMOTION_PROFITABILITY = "0"
TRITON_SPM_ROW_RESIDENT_PRODUCER_PASS = "producer_store"
TRITON_SPM_ROW_RESIDENT_MAX_BYTES = "8192"
TRITON_SPM_SOFTMAX_INTERNAL_ROW_BLOCK = "0"
TRITON_SPM_SOFTMAX_CACHE_EXP = "0"
TRITON_SPM_PROMOTION_REPORT = "1"

[presets.dma-prefetch]
M = 512
N = 512
BLOCK_N = 32
SPM_ROW_BLOCK = 1
SPM_ROW_GROUP_BLOCKS = 1
SPM_INTERNAL_ROW_BLOCK = 0
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[preset_env.dma-prefetch]
TRITON_ENABLE_SPM_ROW_RESIDENT_REDUCTIONS = "1"
TRITON_ENABLE_SPM_PROMOTION_PROFITABILITY = "0"
TRITON_SPM_ROW_RESIDENT_PRODUCER_PASS = "dma_prefetch"
TRITON_SPM_ROW_RESIDENT_MAX_BYTES = "8192"
TRITON_SPM_SOFTMAX_INTERNAL_ROW_BLOCK = "0"
TRITON_SPM_SOFTMAX_CACHE_EXP = "0"
TRITON_SPM_PROMOTION_REPORT = "1"

[presets.row-block-dma]
M = 512
N = 512
BLOCK_N = 32
SPM_ROW_BLOCK = 2
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[preset_env.row-block-dma]
TRITON_ENABLE_SPM_ROW_RESIDENT_REDUCTIONS = "1"
TRITON_ENABLE_SPM_PROMOTION_PROFITABILITY = "0"
TRITON_SPM_ROW_RESIDENT_PRODUCER_PASS = "row_block_dma"
TRITON_SPM_ROW_RESIDENT_MAX_BYTES = "65536"
TRITON_SPM_SOFTMAX_INTERNAL_ROW_BLOCK = "1"
TRITON_SPM_SOFTMAX_CACHE_EXP = "0"
TRITON_SPM_PROMOTION_REPORT = "1"

[presets.row-block-exp-cache]
M = 512
N = 512
BLOCK_N = 32
SPM_ROW_BLOCK = 2
SPM_ROW_GROUP_BLOCKS = 8
SPM_INTERNAL_ROW_BLOCK = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[preset_env.row-block-exp-cache]
TRITON_ENABLE_SPM_ROW_RESIDENT_REDUCTIONS = "1"
TRITON_ENABLE_SPM_PROMOTION_PROFITABILITY = "0"
TRITON_SPM_ROW_RESIDENT_PRODUCER_PASS = "row_block_dma"
TRITON_SPM_ROW_RESIDENT_MAX_BYTES = "65536"
TRITON_SPM_SOFTMAX_INTERNAL_ROW_BLOCK = "1"
TRITON_SPM_SOFTMAX_CACHE_EXP = "1"
TRITON_SPM_PROMOTION_REPORT = "1"

[sweeps.blocking]
values = [
    { name = "canonical", BLOCK_N = 512, SPM_ROW_BLOCK = 1, SPM_ROW_GROUP_BLOCKS = 1, SPM_INTERNAL_ROW_BLOCK = 0 },
]
tag_template = "{M}x{N}/canonical-bn{BLOCK_N}-spmrb{SPM_ROW_BLOCK}-spmrg{SPM_ROW_GROUP_BLOCKS}"

[sweeps.spm_blocking]
values = [
    { name = "rb2rg4", BLOCK_N = 32, SPM_ROW_BLOCK = 2, SPM_ROW_GROUP_BLOCKS = 4, SPM_INTERNAL_ROW_BLOCK = 1 },
    { name = "rb2rg8", BLOCK_N = 32, SPM_ROW_BLOCK = 2, SPM_ROW_GROUP_BLOCKS = 8, SPM_INTERNAL_ROW_BLOCK = 1 },
    { name = "rb2rg16", BLOCK_N = 32, SPM_ROW_BLOCK = 2, SPM_ROW_GROUP_BLOCKS = 16, SPM_INTERNAL_ROW_BLOCK = 1 },
    { name = "rb4rg4", BLOCK_N = 32, SPM_ROW_BLOCK = 4, SPM_ROW_GROUP_BLOCKS = 4, SPM_INTERNAL_ROW_BLOCK = 1 },
    { name = "rb4rg8", BLOCK_N = 32, SPM_ROW_BLOCK = 4, SPM_ROW_GROUP_BLOCKS = 8, SPM_INTERNAL_ROW_BLOCK = 1 },
]
tag_template = "{M}x{N}/canonical-bn{BLOCK_N}-spmrb{SPM_ROW_BLOCK}-spmrg{SPM_ROW_GROUP_BLOCKS}"

[sweeps.sizes]
values = [
    { name = "64x512", M = 64, N = 512, BLOCK_N = 64 },
    { name = "128x512", M = 128, N = 512, BLOCK_N = 64 },
    { name = "128x1024", M = 128, N = 1024, BLOCK_N = 64 },
    { name = "256x1024", M = 256, N = 1024, BLOCK_N = 64 },
]
tag_template = "{M}x{N}/canonical-bn{BLOCK_N}-spmrb{SPM_ROW_BLOCK}-spmrg{SPM_ROW_GROUP_BLOCKS}"
