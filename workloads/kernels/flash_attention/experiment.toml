[kernel]
name = "flash_attention"
env_prefix = "FLASH_ATTENTION_"
tag_template = "s{SEQ}_h{HEAD_DIM}/bm{BLOCK_M}_bn{BLOCK_N}"
expect_spm = true

[kernel.verify]
expect_dma = true

[params]
BATCH = 1
HEADS = 2
SEQ = 32
HEAD_DIM = 16
BLOCK_M = 16
BLOCK_N = 16
CAUSAL = 1
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1
TOLERANCE = "2e-2f"

[mode_params.spm]
BLOCK_M = 16
BLOCK_N = 16

[mode_params.cache]
BLOCK_M = 16
BLOCK_N = 16

[build]
c_macros = [
    "BATCH={BATCH}",
    "HEADS={HEADS}",
    "SEQ={SEQ}",
    "HEAD_DIM={HEAD_DIM}",
    "FLASH_BLOCK_M={BLOCK_M}",
    "FLASH_BLOCK_N={BLOCK_N}",
    "FLASH_ATTENTION_CAUSAL={CAUSAL}",
    "FLASH_ATTENTION_WARMUP_ITERS={WARMUP_ITERS}",
    "FLASH_ATTENTION_MEASURE_ITERS={MEASURE_ITERS}",
    "FLASH_ATTENTION_FLUSH_BEFORE_ROI={FLUSH_BEFORE_ROI}",
    "FLASH_ATTENTION_CHECK_RESULT={CHECK_RESULT}",
    "FLASH_ATTENTION_TOLERANCE={TOLERANCE}",
]

[presets.steady]
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0

[presets.headkv-xspm]
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0

[presets.qheadkv-xspm]
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0

[presets.s512h64-c1]
BATCH = 1
HEADS = 1
SEQ = 512
HEAD_DIM = 64
BLOCK_M = 16
BLOCK_N = 16
CAUSAL = 1
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0
CHECK_RESULT = 0

[preset_env.headkv-xspm]
TRITON_SPM_ATTENTION_Q_RESIDENT = "0"
TRITON_SPM_ATTENTION_KV_STREAM = "0"
TRITON_SPM_FLASH_HEAD_RESIDENT_K = "1"
TRITON_SPM_FLASH_HEAD_RESIDENT_V = "1"
TRITON_SPM_FLASH_HEAD_RESIDENT_CHUNK_ROWS = "128"
TRITON_USE_XSPM_INSN = "1"
TRITON_SPM_PROMOTION_REPORT = "1"

[preset_env.qheadkv-xspm]
TRITON_SPM_ATTENTION_Q_RESIDENT = "1"
TRITON_SPM_ATTENTION_KV_STREAM = "0"
TRITON_SPM_FLASH_HEAD_RESIDENT_K = "1"
TRITON_SPM_FLASH_HEAD_RESIDENT_V = "1"
TRITON_SPM_FLASH_HEAD_RESIDENT_CHUNK_ROWS = "128"
TRITON_USE_XSPM_INSN = "1"
TRITON_SPM_PROMOTION_REPORT = "1"

[preset_env.s512h64-c1]
TRITON_SPM_ATTENTION_Q_RESIDENT = "0"
TRITON_SPM_ATTENTION_KV_STREAM = "0"
TRITON_SPM_FLASH_HEAD_RESIDENT_K = "1"
TRITON_SPM_FLASH_HEAD_RESIDENT_V = "1"
TRITON_SPM_FLASH_HEAD_RESIDENT_CHUNK_ROWS = "128"
TRITON_USE_XSPM_INSN = "0"
TRITON_SPM_PROMOTION_REPORT = "1"

[sweeps.shape]
values = [
    { BATCH = 1, HEADS = 1, SEQ = 32, HEAD_DIM = 16 },
    { BATCH = 1, HEADS = 2, SEQ = 32, HEAD_DIM = 16 },
    { BATCH = 1, HEADS = 2, SEQ = 32, HEAD_DIM = 32 },
    { BATCH = 2, HEADS = 2, SEQ = 32, HEAD_DIM = 16 },
]
tag_template = "s{SEQ}_h{HEAD_DIM}/bm{BLOCK_M}_bn{BLOCK_N}"
