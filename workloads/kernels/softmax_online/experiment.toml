[kernel]
name = "softmax_online"
env_prefix = "SOFTMAX_ONLINE_"
tag_template = "{M}x{N}/online-bn{BLOCK_N}"
expect_spm = false

[params]
M = 512
N = 512
BLOCK_N = 32
CAUSAL = 0
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[build]
c_macros = [
    "M={M}",
    "N={N}",
    "BLOCK_N={BLOCK_N}",
    "SOFTMAX_ONLINE_CAUSAL={CAUSAL}",
    "SOFTMAX_ONLINE_WARMUP_ITERS={WARMUP_ITERS}",
    "SOFTMAX_ONLINE_MEASURE_ITERS={MEASURE_ITERS}",
    "SOFTMAX_ONLINE_FLUSH_BEFORE_ROI={FLUSH_BEFORE_ROI}",
    "SOFTMAX_ONLINE_CHECK_RESULT={CHECK_RESULT}",
]

[mode_params.spm]
BLOCK_N = 32

[presets.steady]
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0

[presets.smoke]
M = 32
N = 64
BLOCK_N = 64
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[presets.large-row]
M = 512
N = 512
BLOCK_N = 32
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[presets.steady-large-row]
M = 512
N = 512
BLOCK_N = 32
WARMUP_ITERS = 2
MEASURE_ITERS = 5
FLUSH_BEFORE_ROI = 0
CHECK_RESULT = 1

[presets.reduction-spm-large-row]
M = 512
N = 512
BLOCK_N = 32
WARMUP_ITERS = 0
MEASURE_ITERS = 1
FLUSH_BEFORE_ROI = 1
CHECK_RESULT = 1

[sweeps.blocking]
values = [
    { name = "online", BLOCK_N = 64 },
]
tag_template = "{M}x{N}/online-bn{BLOCK_N}"

[sweeps.sizes]
values = [
    { name = "64x512", M = 64, N = 512, BLOCK_N = 64 },
    { name = "128x512", M = 128, N = 512, BLOCK_N = 64 },
    { name = "128x1024", M = 128, N = 1024, BLOCK_N = 64 },
    { name = "256x1024", M = 256, N = 1024, BLOCK_N = 64 },
]
tag_template = "{M}x{N}/online-bn{BLOCK_N}"
