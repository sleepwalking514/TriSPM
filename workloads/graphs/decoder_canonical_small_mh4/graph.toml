[graph]
name = "decoder_canonical_small_mh4"
description = "4-head causal decoder-block graph using canonical attention per head: layer_norm -> per-head q/k/v -> k_transpose -> qk -> causal softmax -> pv -> per-head o_proj -> head-sum -> residual_add -> layer_norm -> ffn_up -> activation -> ffn_down -> residual_add. The attention scale is folded into each Q projection weight."

[harness]
source = "harness.c"

[harness.params]
SEQ = 256
HEADS = 4
D_MODEL = 256
HEAD_DIM = 64
FFN_DIM = 1024
BLOCK = 64
QKV_BLOCK_M = 32
QKV_BLOCK_N = 32
QK_BLOCK_M = 32
QK_BLOCK_N = 32
PV_BLOCK_M = 32
PV_BLOCK_N = 32
O_PROJ_BLOCK_M = 32
O_PROJ_BLOCK_N = 32
FFN_UP_BLOCK_M = 32
FFN_UP_BLOCK_N = 32
FFN_DOWN_BLOCK_M = 32
FFN_DOWN_BLOCK_N = 32
K_TRANSPOSE_BLOCK_M = 16
K_TRANSPOSE_BLOCK_N = 16
LAYERNORM_ROW_BLOCK = 4
LAYERNORM_ROW_GROUP_BLOCKS = 8
LAYERNORM_INTERNAL_ROW_BLOCK = 1
SOFTMAX_ROW_BLOCK = 2
SOFTMAX_ROW_GROUP_BLOCKS = 8
SOFTMAX_INTERNAL_ROW_BLOCK = 1
CAUSAL = 1
FOLD_ATTENTION_SCALE_IN_Q = 1
CHECK_RESULT = 0
CHECK_INTERMEDIATES = 0
FLUSH_BEFORE_ROI = 1
TRACE_PROGRESS = 0
DUMP_KERNEL_STATS = 0

[harness.build]
c_macros = ["GRAPH_SEQ={SEQ}", "GRAPH_HEADS={HEADS}", "GRAPH_D_MODEL={D_MODEL}", "GRAPH_HEAD_DIM={HEAD_DIM}", "GRAPH_FFN_DIM={FFN_DIM}", "GRAPH_BLOCK={BLOCK}", "GRAPH_QKV_BLOCK_M={QKV_BLOCK_M}", "GRAPH_QKV_BLOCK_N={QKV_BLOCK_N}", "GRAPH_QK_BLOCK_M={QK_BLOCK_M}", "GRAPH_QK_BLOCK_N={QK_BLOCK_N}", "GRAPH_PV_BLOCK_M={PV_BLOCK_M}", "GRAPH_PV_BLOCK_N={PV_BLOCK_N}", "GRAPH_O_PROJ_BLOCK_M={O_PROJ_BLOCK_M}", "GRAPH_O_PROJ_BLOCK_N={O_PROJ_BLOCK_N}", "GRAPH_FFN_UP_BLOCK_M={FFN_UP_BLOCK_M}", "GRAPH_FFN_UP_BLOCK_N={FFN_UP_BLOCK_N}", "GRAPH_FFN_DOWN_BLOCK_M={FFN_DOWN_BLOCK_M}", "GRAPH_FFN_DOWN_BLOCK_N={FFN_DOWN_BLOCK_N}", "GRAPH_K_TRANSPOSE_BLOCK_M={K_TRANSPOSE_BLOCK_M}", "GRAPH_K_TRANSPOSE_BLOCK_N={K_TRANSPOSE_BLOCK_N}", "GRAPH_LAYERNORM_ROW_BLOCK={LAYERNORM_ROW_BLOCK}", "GRAPH_LAYERNORM_ROW_GROUP_BLOCKS={LAYERNORM_ROW_GROUP_BLOCKS}", "GRAPH_LAYERNORM_INTERNAL_ROW_BLOCK={LAYERNORM_INTERNAL_ROW_BLOCK}", "GRAPH_SOFTMAX_ROW_BLOCK={SOFTMAX_ROW_BLOCK}", "GRAPH_SOFTMAX_ROW_GROUP_BLOCKS={SOFTMAX_ROW_GROUP_BLOCKS}", "GRAPH_SOFTMAX_INTERNAL_ROW_BLOCK={SOFTMAX_INTERNAL_ROW_BLOCK}", "GRAPH_CAUSAL={CAUSAL}", "GRAPH_FOLD_ATTENTION_SCALE_IN_Q={FOLD_ATTENTION_SCALE_IN_Q}", "GRAPH_CHECK_RESULT={CHECK_RESULT}", "GRAPH_CHECK_INTERMEDIATES={CHECK_INTERMEDIATES}", "GRAPH_FLUSH_BEFORE_ROI={FLUSH_BEFORE_ROI}", "GRAPH_TRACE_PROGRESS={TRACE_PROGRESS}", "GRAPH_DUMP_KERNEL_STATS={DUMP_KERNEL_STATS}"]

