[graph]
name = "attention_mh_causal_smoke"
description = "Two-head causal decoder-block graph using decomposed attention per head: layer_norm -> per-head q/k/v -> k_transpose -> qk -> causal softmax -> pv -> per-head o_proj -> head-sum -> residual_add -> layer_norm -> ffn_up -> activation -> ffn_down -> residual_add. The attention scale is folded into each Q projection weight."

[harness]
source = "harness.c"

[harness.params]
SEQ = 32
HEADS = 2
D_MODEL = 32
HEAD_DIM = 16
FFN_DIM = 64
BLOCK = 16
QKV_BLOCK_M = 32
QKV_BLOCK_N = 16
QK_BLOCK_M = 32
QK_BLOCK_N = 16
PV_BLOCK_M = 32
PV_BLOCK_N = 16
O_PROJ_BLOCK_M = 32
O_PROJ_BLOCK_N = 16
FFN_UP_BLOCK_M = 32
FFN_UP_BLOCK_N = 32
FFN_DOWN_BLOCK_M = 32
FFN_DOWN_BLOCK_N = 16
K_TRANSPOSE_BLOCK_M = 16
K_TRANSPOSE_BLOCK_N = 16
SOFTMAX_ROW_BLOCK = 1
SOFTMAX_ROW_GROUP_BLOCKS = 1
SOFTMAX_INTERNAL_ROW_BLOCK = 0
CAUSAL = 1
FOLD_ATTENTION_SCALE_IN_Q = 1
USE_FLASH_ATTENTION = 0
CHECK_RESULT = 1
CHECK_INTERMEDIATES = 0
FLUSH_BEFORE_ROI = 1
TRACE_PROGRESS = 0

[harness.build]
c_macros = [
    "GRAPH_SEQ={SEQ}",
    "GRAPH_HEADS={HEADS}",
    "GRAPH_D_MODEL={D_MODEL}",
    "GRAPH_HEAD_DIM={HEAD_DIM}",
    "GRAPH_FFN_DIM={FFN_DIM}",
    "GRAPH_BLOCK={BLOCK}",
    "GRAPH_QKV_BLOCK_M={QKV_BLOCK_M}",
    "GRAPH_QKV_BLOCK_N={QKV_BLOCK_N}",
    "GRAPH_QK_BLOCK_M={QK_BLOCK_M}",
    "GRAPH_QK_BLOCK_N={QK_BLOCK_N}",
    "GRAPH_PV_BLOCK_M={PV_BLOCK_M}",
    "GRAPH_PV_BLOCK_N={PV_BLOCK_N}",
    "GRAPH_O_PROJ_BLOCK_M={O_PROJ_BLOCK_M}",
    "GRAPH_O_PROJ_BLOCK_N={O_PROJ_BLOCK_N}",
    "GRAPH_FFN_UP_BLOCK_M={FFN_UP_BLOCK_M}",
    "GRAPH_FFN_UP_BLOCK_N={FFN_UP_BLOCK_N}",
    "GRAPH_FFN_DOWN_BLOCK_M={FFN_DOWN_BLOCK_M}",
    "GRAPH_FFN_DOWN_BLOCK_N={FFN_DOWN_BLOCK_N}",
    "GRAPH_K_TRANSPOSE_BLOCK_M={K_TRANSPOSE_BLOCK_M}",
    "GRAPH_K_TRANSPOSE_BLOCK_N={K_TRANSPOSE_BLOCK_N}",
    "GRAPH_SOFTMAX_ROW_BLOCK={SOFTMAX_ROW_BLOCK}",
    "GRAPH_SOFTMAX_ROW_GROUP_BLOCKS={SOFTMAX_ROW_GROUP_BLOCKS}",
    "GRAPH_SOFTMAX_INTERNAL_ROW_BLOCK={SOFTMAX_INTERNAL_ROW_BLOCK}",
    "GRAPH_CAUSAL={CAUSAL}",
    "GRAPH_FOLD_ATTENTION_SCALE_IN_Q={FOLD_ATTENTION_SCALE_IN_Q}",
    "GRAPH_USE_FLASH_ATTENTION={USE_FLASH_ATTENTION}",
    "GRAPH_CHECK_RESULT={CHECK_RESULT}",
    "GRAPH_CHECK_INTERMEDIATES={CHECK_INTERMEDIATES}",
    "GRAPH_FLUSH_BEFORE_ROI={FLUSH_BEFORE_ROI}",
    "GRAPH_TRACE_PROGRESS={TRACE_PROGRESS}",
]

[tensors.x]
kind = "external_input"
read_only = true
dma_only = false
note = "Shape [SEQ, D_MODEL]. LayerNorm input remains on the ordinary DRAM path."

[tensors.gamma]
kind = "external_weight"
read_only = true
dma_only = false

[tensors.beta]
kind = "external_weight"
read_only = true
dma_only = false

[tensors.ln_out]
kind = "intermediate"
producer = "layer_norm"
consumers = ["q_proj_h0", "k_proj_h0", "v_proj_h0", "q_proj_h1", "k_proj_h1", "v_proj_h1"]
note = "Shape [SEQ, D_MODEL]."

[tensors.wq_h0]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [D_MODEL, HEAD_DIM]. Pre-scaled by 1/sqrt(HEAD_DIM) in the harness."

[tensors.wk_h0]
kind = "external_weight"
read_only = true
dma_only = true

[tensors.wv_h0]
kind = "external_weight"
read_only = true
dma_only = true

[tensors.q_h0]
kind = "intermediate"
producer = "q_proj_h0"
consumers = ["qk_h0"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.k_h0]
kind = "intermediate"
producer = "k_proj_h0"
consumers = ["k_transpose_h0"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.k_t_h0]
kind = "intermediate"
producer = "k_transpose_h0"
consumers = ["qk_h0"]
note = "Shape [HEAD_DIM, SEQ]."

[tensors.v_h0]
kind = "intermediate"
producer = "v_proj_h0"
consumers = ["pv_h0"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.scores_h0]
kind = "intermediate"
producer = "qk_h0"
consumers = ["softmax_h0"]
note = "Shape [SEQ, SEQ]."

[tensors.probs_h0]
kind = "intermediate"
producer = "softmax_h0"
consumers = ["pv_h0"]
note = "Shape [SEQ, SEQ]. Causal rows have zero probability above the diagonal."

[tensors.attn_h0]
kind = "intermediate"
producer = "pv_h0"
consumers = ["o_proj_h0"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.wo_h0]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [HEAD_DIM, D_MODEL]. Corresponds to head 0 slice of W_o."

[tensors.attn_proj_h0]
kind = "intermediate"
producer = "o_proj_h0"
consumers = ["attn_head_sum"]
note = "Shape [SEQ, D_MODEL]."

[tensors.wq_h1]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [D_MODEL, HEAD_DIM]. Pre-scaled by 1/sqrt(HEAD_DIM) in the harness."

[tensors.wk_h1]
kind = "external_weight"
read_only = true
dma_only = true

[tensors.wv_h1]
kind = "external_weight"
read_only = true
dma_only = true

[tensors.q_h1]
kind = "intermediate"
producer = "q_proj_h1"
consumers = ["qk_h1"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.k_h1]
kind = "intermediate"
producer = "k_proj_h1"
consumers = ["k_transpose_h1"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.k_t_h1]
kind = "intermediate"
producer = "k_transpose_h1"
consumers = ["qk_h1"]
note = "Shape [HEAD_DIM, SEQ]."

[tensors.v_h1]
kind = "intermediate"
producer = "v_proj_h1"
consumers = ["pv_h1"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.scores_h1]
kind = "intermediate"
producer = "qk_h1"
consumers = ["softmax_h1"]
note = "Shape [SEQ, SEQ]."

[tensors.probs_h1]
kind = "intermediate"
producer = "softmax_h1"
consumers = ["pv_h1"]
note = "Shape [SEQ, SEQ]. Causal rows have zero probability above the diagonal."

[tensors.attn_h1]
kind = "intermediate"
producer = "pv_h1"
consumers = ["o_proj_h1"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.wo_h1]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [HEAD_DIM, D_MODEL]. Corresponds to head 1 slice of W_o."

[tensors.attn_proj_h1]
kind = "intermediate"
producer = "o_proj_h1"
consumers = ["attn_head_sum"]
note = "Shape [SEQ, D_MODEL]."

[tensors.attn_sum]
kind = "intermediate"
producer = "attn_head_sum"
consumers = ["attn_residual_add"]
note = "Shape [SEQ, D_MODEL]. Sum of per-head output-projection partials, equivalent to concat(heads) @ W_o."

[tensors.residual]
kind = "external_input"
read_only = true
dma_only = false
note = "Shape [SEQ, D_MODEL]."

[tensors.resid_out]
kind = "intermediate"
producer = "attn_residual_add"
consumers = ["ln2", "final_residual_add"]
note = "Shape [SEQ, D_MODEL]."

[tensors.gamma2]
kind = "external_weight"
read_only = true
dma_only = false

[tensors.beta2]
kind = "external_weight"
read_only = true
dma_only = false

[tensors.ln2_out]
kind = "intermediate"
producer = "ln2"
consumers = ["ffn_up"]
note = "Shape [SEQ, D_MODEL]."

[tensors.w_up]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [D_MODEL, FFN_DIM]."

[tensors.ffn_hidden]
kind = "intermediate"
producer = "ffn_up"
consumers = ["ffn_activation"]
note = "Shape [SEQ, FFN_DIM]."

[tensors.ffn_act]
kind = "intermediate"
producer = "ffn_activation"
consumers = ["ffn_down"]
note = "Shape [SEQ, FFN_DIM]."

[tensors.w_down]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [FFN_DIM, D_MODEL]."

[tensors.ffn_out]
kind = "intermediate"
producer = "ffn_down"
consumers = ["final_residual_add"]
note = "Shape [SEQ, D_MODEL]."

[tensors.block_out]
kind = "graph_output"
producer = "final_residual_add"
note = "Shape [SEQ, D_MODEL]."

[nodes.layer_norm]
kernel = "layer_norm"
args = ["x", "gamma", "beta", "ln_out"]

[nodes.layer_norm.params]
M = 32
N = 32
CHECK_RESULT = 0
LAYERNORM_FLUSH_BEFORE_ROI = 1
SPM_ROW_BLOCK = 1
SPM_ROW_GROUP_BLOCKS = 1
SPM_INTERNAL_ROW_BLOCK = 0

[nodes.q_proj_h0]
kernel = "matmul"
args = ["ln_out", "wq_h0", "q_h0"]

[nodes.q_proj_h0.params]
M = 32
N = 16
K = 32
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 16
BLOCK_SIZE_K = 32
