[graph]
name = "attention_flash_smoke"
description = "Decoder-block-facing graph variant with FlashAttention-style exact online-softmax attention: layer_norm -> q/k/v -> flash_attention -> o_proj -> residual_add -> layer_norm -> ffn_up -> activation -> ffn_down -> residual_add."

[harness]
source = "../attention_smoke/harness.c"

[harness.params]
SEQ = 32
D_MODEL = 32
HEAD_DIM = 16
FFN_DIM = 64
BLOCK = 16
QKV_BLOCK_M = 32
QKV_BLOCK_N = 16
FLASH_BLOCK_M = 16
FLASH_BLOCK_N = 16
FLASH_CAUSAL = 1
O_PROJ_BLOCK_M = 32
O_PROJ_BLOCK_N = 16
FFN_UP_BLOCK_M = 32
FFN_UP_BLOCK_N = 32
FFN_DOWN_BLOCK_M = 32
FFN_DOWN_BLOCK_N = 16
CHECK_RESULT = 1
CHECK_INTERMEDIATES = 0
FLUSH_BEFORE_ROI = 1
USE_FLASH_ATTENTION = 1

[harness.build]
c_macros = [
    "GRAPH_SEQ={SEQ}",
    "GRAPH_D_MODEL={D_MODEL}",
    "GRAPH_HEAD_DIM={HEAD_DIM}",
    "GRAPH_FFN_DIM={FFN_DIM}",
    "GRAPH_BLOCK={BLOCK}",
    "GRAPH_QKV_BLOCK_M={QKV_BLOCK_M}",
    "GRAPH_QKV_BLOCK_N={QKV_BLOCK_N}",
    "GRAPH_FLASH_BLOCK_M={FLASH_BLOCK_M}",
    "GRAPH_FLASH_BLOCK_N={FLASH_BLOCK_N}",
    "GRAPH_FLASH_CAUSAL={FLASH_CAUSAL}",
    "GRAPH_O_PROJ_BLOCK_M={O_PROJ_BLOCK_M}",
    "GRAPH_O_PROJ_BLOCK_N={O_PROJ_BLOCK_N}",
    "GRAPH_FFN_UP_BLOCK_M={FFN_UP_BLOCK_M}",
    "GRAPH_FFN_UP_BLOCK_N={FFN_UP_BLOCK_N}",
    "GRAPH_FFN_DOWN_BLOCK_M={FFN_DOWN_BLOCK_M}",
    "GRAPH_FFN_DOWN_BLOCK_N={FFN_DOWN_BLOCK_N}",
    "GRAPH_CHECK_RESULT={CHECK_RESULT}",
    "GRAPH_CHECK_INTERMEDIATES={CHECK_INTERMEDIATES}",
    "GRAPH_FLUSH_BEFORE_ROI={FLUSH_BEFORE_ROI}",
    "GRAPH_USE_FLASH_ATTENTION={USE_FLASH_ATTENTION}",
]

[tensors.x]
kind = "external_input"
read_only = true
dma_only = false
note = "LayerNorm input remains on the ordinary DRAM path."

[tensors.gamma]
kind = "external_weight"
read_only = true
dma_only = false
note = "LayerNorm scale has reduction/scalar-style access and remains on ordinary DRAM."

[tensors.beta]
kind = "external_weight"
read_only = true
dma_only = false
note = "LayerNorm bias has reduction/scalar-style access and remains on ordinary DRAM."

[tensors.ln_out]
kind = "intermediate"
producer = "layer_norm"
consumers = ["q_proj", "k_proj", "v_proj"]

[tensors.wq]
kind = "external_weight"
read_only = true
dma_only = true

[tensors.wk]
kind = "external_weight"
read_only = true
dma_only = true

[tensors.wv]
kind = "external_weight"
read_only = true
dma_only = true

[tensors.q]
kind = "intermediate"
producer = "q_proj"
consumers = ["flash_attention"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.k]
kind = "intermediate"
producer = "k_proj"
consumers = ["flash_attention"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.v]
kind = "intermediate"
producer = "v_proj"
consumers = ["flash_attention"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.attn]
kind = "intermediate"
producer = "flash_attention"
consumers = ["o_proj"]
note = "Shape [SEQ, HEAD_DIM]."

[tensors.wo]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [HEAD_DIM, D_MODEL]."

[tensors.attn_proj]
kind = "intermediate"
producer = "o_proj"
consumers = ["attn_residual_add"]
note = "Shape [SEQ, D_MODEL]."

[tensors.residual]
kind = "external_input"
read_only = true
dma_only = false
note = "Shape [SEQ, D_MODEL]."

[tensors.resid_out]
kind = "intermediate"
producer = "attn_residual_add"
consumers = ["ln2", "final_residual_add"]
note = "Shape [SEQ, D_MODEL]."

[tensors.gamma2]
kind = "external_weight"
read_only = true
dma_only = false
note = "Second LayerNorm scale has reduction/scalar-style access and remains on ordinary DRAM."

[tensors.beta2]
kind = "external_weight"
read_only = true
dma_only = false
note = "Second LayerNorm bias has reduction/scalar-style access and remains on ordinary DRAM."

[tensors.ln2_out]
kind = "intermediate"
producer = "ln2"
consumers = ["ffn_up"]
note = "Shape [SEQ, D_MODEL]."

[tensors.w_up]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [D_MODEL, FFN_DIM]."

[tensors.ffn_hidden]
kind = "intermediate"
producer = "ffn_up"
consumers = ["ffn_activation"]
note = "Shape [SEQ, FFN_DIM]."

[tensors.ffn_act]
kind = "intermediate"
producer = "ffn_activation"
consumers = ["ffn_down"]
note = "Shape [SEQ, FFN_DIM]."

[tensors.w_down]
kind = "external_weight"
read_only = true
dma_only = true
note = "Shape [FFN_DIM, D_MODEL]."

[tensors.ffn_out]
kind = "intermediate"
producer = "ffn_down"
consumers = ["final_residual_add"]
note = "Shape [SEQ, D_MODEL]."

[tensors.block_out]
kind = "graph_output"
producer = "final_residual_add"
note = "Shape [SEQ, D_MODEL]."

[nodes.layer_norm]
kernel = "layer_norm"
args = ["x", "gamma", "beta", "ln_out"]
tag = "graph/attention_flash_smoke/layer_norm"

[nodes.layer_norm.params]
M = 32
N = 32
CHECK_RESULT = 0
LAYERNORM_FLUSH_BEFORE_ROI = 1
SPM_ROW_BLOCK = 1
SPM_ROW_GROUP_BLOCKS = 1
SPM_INTERNAL_ROW_BLOCK = 0

[nodes.q_proj]
kernel = "matmul"
args = ["ln_out", "wq", "q"]
tag = "graph/attention_flash_smoke/q_proj"

[nodes.q_proj.params]
M = 32
N = 16
K = 32
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 16
BLOCK_SIZE_K = 32
CHECK_RESULT = 0

[nodes.k_proj]
kernel = "matmul"
args = ["ln_out", "wk", "k"]
tag = "graph/attention_flash_smoke/k_proj"

[nodes.k_proj.params]
M = 32
N = 16
K = 32
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 16
BLOCK_SIZE_K = 32
CHECK_RESULT = 0

[nodes.v_proj]
kernel = "matmul"
args = ["ln_out", "wv", "v"]
tag = "graph/attention_flash_smoke/v_proj"

[nodes.v_proj.params]
M = 32
N = 16
K = 32
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 16
BLOCK_SIZE_K = 32
CHECK_RESULT = 0

[nodes.flash_attention]
kernel = "flash_attention"
args = ["q", "k", "v", "attn"]
tag = "graph/attention_flash_smoke/flash_attention"

[nodes.flash_attention.params]
BATCH = 1
HEADS = 1
SEQ = 32
HEAD_DIM = 16
BLOCK_M = 16
BLOCK_N = 16
CAUSAL = 1
CHECK_RESULT = 0

[nodes.o_proj]
kernel = "matmul"
args = ["attn", "wo", "attn_proj"]
tag = "graph/attention_flash_smoke/o_proj"

[nodes.o_proj.params]
M = 32
N = 32
K = 16
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 16
BLOCK_SIZE_K = 16
CHECK_RESULT = 0

[nodes.attn_residual_add]
kernel = "residual_add"
args = ["attn_proj", "residual", "resid_out"]
tag = "graph/attention_flash_smoke/attn_residual_add"

[nodes.attn_residual_add.params]
SIZE = 1024
BLOCK_SIZE = 16
CHECK_RESULT = 0

[nodes.ln2]
kernel = "layer_norm"
args = ["resid_out", "gamma2", "beta2", "ln2_out"]
tag = "graph/attention_flash_smoke/ln2"

[nodes.ln2.params]
M = 32
N = 32
CHECK_RESULT = 0
LAYERNORM_FLUSH_BEFORE_ROI = 1
SPM_ROW_BLOCK = 1
SPM_ROW_GROUP_BLOCKS = 1
SPM_INTERNAL_ROW_BLOCK = 0

[nodes.ffn_up]
kernel = "matmul"
args = ["ln2_out", "w_up", "ffn_hidden"]
tag = "graph/attention_flash_smoke/ffn_up"

[nodes.ffn_up.params]
M = 32
N = 64
K = 32
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 32
BLOCK_SIZE_K = 32
CHECK_RESULT = 0

[nodes.ffn_activation]
kernel = "activation"
args = ["ffn_hidden", "ffn_act"]
tag = "graph/attention_flash_smoke/ffn_activation"

[nodes.ffn_activation.params]
SIZE = 2048
BLOCK_SIZE = 16
CHECK_RESULT = 0

[nodes.ffn_down]
kernel = "matmul"
args = ["ffn_act", "w_down", "ffn_out"]
tag = "graph/attention_flash_smoke/ffn_down"

[nodes.ffn_down.params]
M = 32
N = 32
K = 64
BLOCK_SIZE_M = 32
BLOCK_SIZE_N = 16
BLOCK_SIZE_K = 32
CHECK_RESULT = 0

[nodes.final_residual_add]
kernel = "residual_add"
args = ["ffn_out", "resid_out", "block_out"]
tag = "graph/attention_flash_smoke/final_residual_add"

[nodes.final_residual_add.params]
SIZE = 1024
BLOCK_SIZE = 16
CHECK_RESULT = 0

[presets.large.graph]
